name: Publish website

on:
  push:
    branches: [feat/atlas-revamp, main]
    paths:
      - 'website/**'
      - 'src/renderer/src/atlas/celestialSprites.ts'
      - 'src/renderer/src/atlas/stellarVisual.ts'
      - 'src/shared/types.ts'
      - 'vite.site.config.ts'
      - 'tsconfig.site.json'
      - 'package*.json'
      - 'LICENSE'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-palace-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
