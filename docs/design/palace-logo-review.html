<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Palace — ten logo directions</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#0b1019;color:#eeeae2}*{box-sizing:border-box}body{margin:0;padding:36px 48px}header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px}h1{font:34px Georgia,serif;font-weight:400;margin:0}header p,footer{font-size:10px;color:#8995a6;letter-spacing:1.4px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 18px}.candidate{color:inherit;background:transparent;border:1px solid #ffffff12;border-radius:4px;padding:10px 12px 17px;cursor:pointer}.candidate:hover,.candidate:focus-visible{border-color:#e4c28b;outline:none}.art{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;overflow:hidden}.art svg{display:block;width:100%;height:100%;overflow:hidden}.label{display:block;font-size:12px;color:#b8c0cc;margin-top:12px;letter-spacing:.3px}.label b{font-weight:400;color:#e4c28b;margin-right:10px}.defs{position:absolute;width:0;height:0;overflow:hidden}footer{margin-top:25px;display:flex;justify-content:space-between;gap:20px}dialog{background:#0b1019;color:#eeeae2;border:1px solid #ffffff30;border-radius:8px;padding:25px;width:min(650px,90vw)}dialog::backdrop{background:#000b}.zoom-art{height:min(65vh,620px)}.zoom-art svg{width:100%;height:100%;overflow:hidden}dialog button{float:right;background:none;color:inherit;border:0;padding:8px;cursor:pointer}dialog h2{font:24px Georgia,serif}.zoom-art svg image{image-rendering:auto}@media(max-width:900px){body{padding:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;gap:20px}h1{font-size:28px}footer{line-height:1.6;flex-direction:column}}@media print{body{width:1500px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style></head><body><svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <!-- Same star silhouette throughout: long points and concave shoulders. -->
    <path id="star" d="M0-20C0-6 6 0 20 0C6 0 0 6 0 20C0 6-6 0-20 0C-6 0 0-6 0-20Z"/>
    <g id="connections" fill="none" stroke="#dce6f2" stroke-opacity=".24" stroke-width=".8" stroke-linejoin="round">
      <path d="M52 89H188M74 132H166L156 174H84ZM60 222H180L194 264H46Z"/>
    </g>
    <g id="stars">
      <!-- The dot sits left of the shared center to imply the angled 丶.
           Horizontal tiers stay level. The middle tapers; the base flares. -->
      <use href="#star" transform="translate(110 34) scale(1.15)"/>
      <use href="#star" transform="translate(52 89) scale(1.15)"/>
      <use href="#star" transform="translate(188 89) scale(1.15)"/>
      <use href="#star" transform="translate(74 132) scale(.76)"/>
      <use href="#star" transform="translate(166 132) scale(.76)"/>
      <use href="#star" transform="translate(84 174) scale(.76)"/>
      <use href="#star" transform="translate(156 174) scale(.76)"/>
      <use href="#star" transform="translate(60 222) scale(.76)"/>
      <use href="#star" transform="translate(180 222) scale(.76)"/>
      <use href="#star" transform="translate(46 264) scale(.76)"/>
      <use href="#star" transform="translate(194 264) scale(.76)"/>
    </g>
    <symbol id="outline" viewBox="0 0 240 300">
      <use href="#connections"/>
      <use href="#stars" fill="#0b1019" stroke="#f2eee7" stroke-width="1.05"/>
    </symbol>
    <symbol id="filled" viewBox="0 0 240 300">
      <use href="#connections"/>
      <use href="#stars" fill="#eeeae2" transform="translate(120 150) scale(1) translate(-120 -150)"/>
    </symbol>
  </defs>
</svg><header><h1>Star Palace</h1><p>宫 / TEN DIRECTIONS</p></header><main class="grid"><button class="candidate" data-number="01" aria-label="Enlarge option 01: Reference"><span class="art"><svg viewBox="0 0 240 300" aria-hidden="true"><use href="#outline"/></svg></span><span class="label"><b>01</b> Reference</span></button><button class="candidate" data-number="02" aria-label="Enlarge option 02: Pinpoints"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-334.4" y="-165" width="1672" height="941"/></svg></span><span class="label"><b>02</b> Pinpoints</span></button><button class="candidate" data-number="03" aria-label="Enlarge option 03: Star clusters"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-668.8" y="-165" width="1672" height="941"/></svg></span><span class="label"><b>03</b> Star clusters</span></button><button class="candidate" data-number="04" aria-label="Enlarge option 04: Facets"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-1003.1999999999999" y="-165" width="1672" height="941"/></svg></span><span class="label"><b>04</b> Facets</span></button><button class="candidate" data-number="05" aria-label="Enlarge option 05: Diffraction"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-1337.6" y="-165" width="1672" height="941"/></svg></span><span class="label"><b>05</b> Diffraction</span></button><button class="candidate" data-number="06" aria-label="Enlarge option 06: Stellar magnitudes"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="0.0" y="-530" width="1672" height="941"/></svg></span><span class="label"><b>06</b> Stellar magnitudes</span></button><button class="candidate" data-number="07" aria-label="Enlarge option 07: Seal"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-334.4" y="-530" width="1672" height="941"/></svg></span><span class="label"><b>07</b> Seal</span></button><button class="candidate" data-number="08" aria-label="Enlarge option 08: Asymmetry"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-668.8" y="-530" width="1672" height="941"/></svg></span><span class="label"><b>08</b> Asymmetry</span></button><button class="candidate" data-number="09" aria-label="Enlarge option 09: Negative space"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-1003.1999999999999" y="-530" width="1672" height="941"/></svg></span><span class="label"><b>09</b> Negative space</span></button><button class="candidate" data-number="10" aria-label="Enlarge option 10: Crescent"><span class="art"><svg viewBox="0 0 334.4 305" aria-hidden="true"><image href="palace-logo-directions.png" x="-1337.6" y="-530" width="1672" height="941"/></svg></span><span class="label"><b>10</b> Crescent</span></button></main><footer><span>01 follows your sketch. Nine other compositions.</span><span>Click a direction to enlarge · Concepts for selection</span></footer><dialog><button type="button" aria-label="Close enlarged option">Close ×</button><h2></h2><div class="zoom-art"></div></dialog><script>
const dialog=document.querySelector('dialog');document.querySelectorAll('.candidate').forEach(button=>button.addEventListener('click',()=>{dialog.querySelector('h2').textContent=button.querySelector('.label').textContent;dialog.querySelector('.zoom-art').replaceChildren(button.querySelector('svg').cloneNode(true));dialog.showModal()}));dialog.querySelector('button').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
</script></body></html>
